<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pedidos · Veliroz CRM</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/assets/favicon.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
<link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div class="app"></div>

<template id="pageTemplate">
  <div class="page">
    <div class="flex items-center justify-between mb-4">
      <div><h2>Pedidos</h2><p class="lead">Toda la operación pasa por acá</p></div>
      <div class="flex gap-2"><input type="search" id="q" placeholder="Código, cliente, teléfono, email…" style="width:280px"/></div>
    </div>
    <div class="tab-strip">
      <button class="tab-btn active" data-est="">Todos</button>
      <button class="tab-btn" data-est="nuevo">Nuevos</button>
      <button class="tab-btn" data-est="pagado">Pagados</button>
      <button class="tab-btn" data-est="preparando">Preparando</button>
      <button class="tab-btn" data-est="en_reparto">En reparto</button>
      <button class="tab-btn" data-est="entregado">Entregados</button>
      <button class="tab-btn" data-est="cancelado">Cancelados</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <div style="overflow-x:auto;max-height:70vh;overflow-y:auto;">
        <table class="data">
          <thead><tr><th>Código</th><th>Cliente</th><th>Fecha</th><th>Línea</th><th>Pago</th><th>Entrega</th><th class="num">Total</th><th>Estado</th></tr></thead>
          <tbody id="tblPedidos"><tr><td colspan="8" class="text-muted text-small" style="text-align:center;padding:30px;">Cargando…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal detalle -->
  <div class="modal-back hidden" id="detModal">
    <div class="modal" style="max-width:720px;">
      <div class="modal-header">
        <div><div class="text-small text-muted" style="text-transform:uppercase;letter-spacing:.08em;font-weight:700;">Pedido</div><h3 id="detCod">—</h3></div>
        <button class="icon-btn" onclick="window.ui.closeModal('detModal')"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div id="detBody"><div class="text-muted text-small">Cargando…</div></div>
    </div>
  </div>
</template>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/js/config.js"></script>
<script src="/js/sb.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/router.js"></script>
<script>
window.shell.render({
  active:'pedidos', title:'Pedidos',
  onReady: async who => {
    let filtroEstado = '';
    let filtroQ = '';
    const canWrite = ['creador','admin','operador'].includes(who.rol);
    window.ui.bindModalClose('detModal');
    async function load() {
      const tb = document.getElementById('tblPedidos');
      tb.innerHTML = '<tr><td colspan="8" class="text-muted text-small" style="text-align:center;padding:30px;">Cargando…</td></tr>';
      let filter = 'select=id,pedido_codigo,cliente_nombre,cliente_email,cliente_telefono,linea_negocio,metodo_pago,metodo_entrega,zona_local,total,estado,fecha_pedido&order=fecha_pedido.desc&limit=200';
      if (filtroEstado) filter += '&estado=eq.' + filtroEstado;
      if (filtroQ) {
        const q = filtroQ.replace(/,/g,'').trim();
        filter += `&or=(pedido_codigo.ilike.*${encodeURIComponent(q)}*,cliente_nombre.ilike.*${encodeURIComponent(q)}*,cliente_email.ilike.*${encodeURIComponent(q)}*,cliente_telefono.ilike.*${encodeURIComponent(q)}*)`;
      }
      try {
        const rows = await window.sb.get('pedidos?' + filter);
        if (!rows.length) { tb.innerHTML = '<tr><td colspan="8" class="text-muted text-small" style="text-align:center;padding:30px;">Sin resultados.</td></tr>'; return; }
        tb.innerHTML = rows.map(p => `
          <tr data-id="${window.ui.esc(p.id)}" data-cod="${window.ui.esc(p.pedido_codigo)}">
            <td class="mono">${window.ui.esc(p.pedido_codigo)}</td>
            <td>${window.ui.esc(p.cliente_nombre || '—')}<div class="muted-cell">${window.ui.esc(p.cliente_email || '')}</div></td>
            <td class="text-small">${window.ui.fmtDate(p.fecha_pedido)}</td>
            <td class="text-small">${window.ui.esc(p.linea_negocio)}</td>
            <td class="text-small">${window.ui.esc(p.metodo_pago)}</td>
            <td class="text-small">${window.ui.esc(p.metodo_entrega)}${p.zona_local ? ' · ' + window.ui.esc(p.zona_local) : ''}</td>
            <td class="num">${window.ui.fmtSoles(p.total)}</td>
            <td>${window.ui.badgeEstado(p.estado)}</td>
          </tr>`).join('');
        tb.querySelectorAll('tr[data-id]').forEach(tr => {
          tr.addEventListener('click', () => openDetalle(tr.dataset.id, tr.dataset.cod));
        });
      } catch (e) {
        tb.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--danger);">Error: ' + window.ui.esc(e.message) + '</td></tr>';
      }
    }
    async function openDetalle(id, codigo) {
      document.getElementById('detCod').textContent = codigo;
      document.getElementById('detBody').innerHTML = '<div class="text-muted text-small">Cargando…</div>';
      window.ui.openModal('detModal');
      try {
        const [arr, lineas, timeline] = await Promise.all([
          window.sb.get(`pedidos?select=*&id=eq.${id}&limit=1`),
          window.sb.get(`lineas_pedido?select=*&pedido_id=eq.${id}`),
          window.sb.get(`pedido_timeline?select=*&pedido_id=eq.${id}&order=created_at.desc&limit=20`)
        ]);
        const p = arr[0];
        if (!p) { document.getElementById('detBody').innerHTML = '<p>No encontrado.</p>'; return; }
        const esc = window.ui.esc, fmt = window.ui.fmtSoles;
        const acciones = canWrite ? renderAcciones(p, who) : '<div class="text-muted text-small">Solo lectura para tu rol.</div>';
        document.getElementById('detBody').innerHTML = `
          <div class="form-grid text-small mb-4">
            <div><label>Cliente</label><div><strong>${esc(p.cliente_nombre||'—')}</strong><br><span class="text-muted">${esc(p.cliente_email||'')}</span><br><span class="text-muted">${esc(p.cliente_telefono||'')}</span></div></div>
            <div><label>Entrega</label><div>${esc(p.metodo_entrega)}${p.zona_local?' · '+esc(p.zona_local):''}<br><span class="text-muted">${esc(p.direccion||'')}</span></div></div>
            <div><label>Pago</label><div><strong>${esc(p.metodo_pago)}</strong> · ${esc(p.mp_status||'—')}</div></div>
            <div><label>Comprobante</label><div>${esc(p.tipo_comprobante||'—')} ${p.documento?'#'+esc(p.documento):''}<br>${esc(p.razon_social||'')}</div></div>
          </div>
          <div class="mb-4"><label>Ítems</label><div class="mt-2">
            ${lineas.map(l => `<div class="flex justify-between text-small" style="padding:6px 0;border-bottom:1px solid var(--border-2);"><span>${esc(l.nombre)} × ${l.cantidad}</span><span style="font-weight:600;">${fmt(l.subtotal_linea)}</span></div>`).join('')}
          </div></div>
          <div class="form-grid text-small mb-4">
            <div><label>Subtotal</label><div>${fmt(p.subtotal)}</div></div>
            <div><label>Envío</label><div>${fmt(p.costo_envio)}</div></div>
            <div class="full" style="border-top:1px solid var(--border-2);padding-top:8px;"><label>Total</label><div style="font-size:20px;font-weight:700;color:var(--rose);">${fmt(p.total)}</div></div>
          </div>
          <div class="mb-4"><label>Timeline</label><div class="mt-2">
            ${timeline.map(t => `<div class="text-small" style="padding:6px 0;border-bottom:1px solid var(--border-2);"><span class="text-muted">${window.ui.fmtDate(t.created_at)}</span> · <strong>${esc(t.evento)}</strong> ${t.desde_estado ? esc(t.desde_estado) + ' → ' + esc(t.hasta_estado) : (t.hasta_estado ? esc(t.hasta_estado) : '')} <span class="text-muted">(${esc(t.actor_email||'sistema')})</span></div>`).join('')}
          </div></div>
          ${acciones}
        `;
        bindAcciones(p, who);
      } catch (e) {
        document.getElementById('detBody').innerHTML = '<p class="text-small" style="color:var(--danger);">Error: ' + window.ui.esc(e.message) + '</p>';
      }
    }
    function renderAcciones(p, who) {
      const estados = ['nuevo','pagado','preparando','en_reparto','entregado','cancelado'];
      const compType = p.tipo_comprobante === 'factura' ? '📄 Factura' : '🧾 Boleta';
      return `<div class="mt-4" style="border-top:1px solid var(--border-2);padding-top:16px;">
        <label>Cambiar estado</label>
        <div class="flex gap-2 mt-2">
          <select id="selEstado">${estados.map(e=>`<option value="${e}" ${p.estado===e?'selected':''}>${e}</option>`).join('')}</select>
          <button class="btn" id="btnEstado">Guardar</button>
        </div>
        <div class="mt-4">
          <label>Confirmar pago con voucher</label>
          <div class="flex gap-2 mt-2 items-center">
            <input type="file" id="voucher" accept="image/*,application/pdf"/>
            <button class="btn success sm" id="btnPago">Confirmar pago</button>
          </div>
          <div class="text-muted text-small mt-2">Yape/Plin/Banco requieren voucher.</div>
        </div>
        <div class="mt-4">
          <label>Enviar comprobante al cliente (${compType})</label>
          <div class="flex gap-2 mt-2">
            <button class="btn secondary sm" id="btnComprobante"><span class="material-symbols-outlined">receipt_long</span>Preparar mensaje</button>
          </div>
        </div>
      </div>`;
    }
    function bindAcciones(p, who) {
      const btnE = document.getElementById('btnEstado');
      if (btnE) btnE.addEventListener('click', async () => {
        const nuevo = document.getElementById('selEstado').value;
        try { await window.sb.rpc('cambiar_estado_pedido', { p_pedido_id: p.id, p_nuevo_estado: nuevo }); window.ui.toast('Estado actualizado', 'success'); window.ui.closeModal('detModal'); load(); }
        catch (e) { window.ui.toast('Error: ' + e.message, 'danger'); }
      });
      const btnP = document.getElementById('btnPago');
      if (btnP) btnP.addEventListener('click', async () => {
        const f = document.getElementById('voucher').files[0];
        let path = null;
        if (f) {
          path = 'pagos/' + p.id + '/' + Date.now() + '-' + f.name.replace(/[^a-zA-Z0-9.-]/g,'_');
          try { await window.sb.upload(window.VELIROZ_CRM.bucket, path, f); }
          catch (e) { window.ui.toast('Fallo subir voucher: ' + e.message, 'danger'); return; }
        }
        try {
          await window.sb.rpc('confirmar_pago', { p_pedido_id: p.id, p_metodo: p.metodo_pago, p_evidencia_path: path });
          window.ui.toast('Pago confirmado', 'success');
          // Auto-abrir modal de comprobante después de confirmar
          setTimeout(() => abrirComprobante(p), 400);
        } catch (e) { window.ui.toast('Error: ' + e.message, 'danger'); }
      });
      const btnC = document.getElementById('btnComprobante');
      if (btnC) btnC.addEventListener('click', () => abrirComprobante(p));
    }

    function comprobanteMsg(p) {
      const esFactura = p.tipo_comprobante === 'factura';
      const partes = [
        `Hola ${p.cliente_nombre || ''}! 🌸`,
        `Confirmamos tu pago del pedido *${p.pedido_codigo}*`,
        ``,
        `📋 *Datos del comprobante*`,
        esFactura
          ? `Factura a: ${p.razon_social || '—'}\nRUC: ${p.documento || '—'}${p.direccion_fiscal ? '\nDirección: '+p.direccion_fiscal : ''}`
          : `Boleta a nombre de: ${p.cliente_nombre || '—'}${p.documento ? '\nDNI: '+p.documento : ''}`,
        ``,
        `💰 Subtotal: S/. ${(p.subtotal||0).toFixed(2)}`,
        `🚚 Envío: S/. ${(p.costo_envio||0).toFixed(2)}`,
        `*Total pagado: S/. ${(p.total||0).toFixed(2)}*`,
        ``,
        `📎 En las próximas horas te envío ${esFactura ? 'la factura formal' : 'la boleta electrónica'} en PDF.`,
        ``,
        `¡Gracias por confiar en Veliroz! 💐`
      ];
      return partes.join('\n');
    }

    function abrirComprobante(p) {
      // Reutilizar modal detalle: convertirlo temporalmente en editor de mensaje
      const body = document.getElementById('detBody');
      const esFactura = p.tipo_comprobante === 'factura';
      const compType = esFactura ? '📄 Factura' : '🧾 Boleta';
      document.getElementById('detCod').textContent = 'Comprobante · ' + p.pedido_codigo;
      body.innerHTML = `
        <div class="mb-3 text-small text-muted">Tipo: <strong>${compType}</strong> · Para: <strong>${window.ui.esc(p.cliente_nombre||'')}</strong> · Tel: <strong>${window.ui.esc(p.cliente_telefono||'—')}</strong></div>
        <label>Mensaje para WhatsApp (editable)</label>
        <textarea id="compMsgP" rows="14" style="width:100%;font-family:inherit;font-size:13px;line-height:1.5;margin-top:6px;"></textarea>
        <div class="mt-4 flex gap-2">
          <a class="btn" id="btnWaComp" target="_blank" style="flex:1;justify-content:center;">
            <span class="material-symbols-outlined">chat</span> Enviar por WhatsApp
          </a>
          <button class="btn ghost" onclick="load(); window.ui.closeModal('detModal');">Cerrar</button>
        </div>
        <p class="text-small text-muted mt-3">💡 Cuando emitas la boleta/factura formal en SUNAT, adjuntá el PDF por el mismo chat.</p>
      `;
      const ta = document.getElementById('compMsgP');
      const link = document.getElementById('btnWaComp');
      ta.value = comprobanteMsg(p);
      const refresh = () => { link.href = window.ui.whatsappUrl(p.cliente_telefono, ta.value); };
      refresh();
      ta.oninput = refresh;
      window.ui.openModal('detModal');
    }
    document.getElementById('q').addEventListener('input', window.ui.debounce(e => { filtroQ = e.target.value.trim(); load(); }, 400));
    document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      filtroEstado = b.dataset.est;
      load();
    }));
    // Auto-open si viene ?q=CODIGO en URL
    const urlQ = new URLSearchParams(location.search).get('q');
    if (urlQ) { document.getElementById('q').value = urlQ; filtroQ = urlQ; }
    load();
  }
});
</script>
</body>
</html>
