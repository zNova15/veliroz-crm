<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Entregas · Veliroz CRM</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/assets/favicon.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
<link rel="stylesheet" href="/css/main.css"/>
<style>
.entrega-card { background:#fff; border-radius:16px; padding:16px; margin-bottom:12px; border:1px solid var(--border-2); box-shadow:var(--shadow); }
.entrega-card .zona { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; }
.entrega-card h4 { margin:4px 0 8px; font-family:'Noto Serif',serif; font-size:16px; color:var(--ink-2); }
.entrega-card .row { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; }
.entrega-card .row .material-symbols-outlined { font-size:18px; color:var(--muted); }
.entrega-actions { display:flex; gap:8px; margin-top:12px; }
.entrega-actions .btn { flex:1; justify-content:center; padding:12px; font-size:14px; }
.foto-drop { border:2px dashed var(--border); border-radius:12px; padding:20px; text-align:center; margin:12px 0; cursor:pointer; }
.foto-drop img { max-width:100%; border-radius:8px; margin-top:8px; }
</style>
</head>
<body>
<div class="app"></div>

<template id="pageTemplate">
  <div class="page">
    <div class="flex items-center justify-between mb-4">
      <div><h2>Entregas</h2><p class="lead" id="leadEntregas">—</p></div>
    </div>
    <div id="listaEntregas"><div class="text-muted text-small">Cargando…</div></div>
  </div>

  <div class="modal-back hidden" id="entregaModal">
    <div class="modal" style="max-width:520px;">
      <div class="modal-header">
        <div><div class="text-small text-muted">Marcar entregado</div><h3 id="emCod">—</h3></div>
        <button class="icon-btn" onclick="window.ui.closeModal('entregaModal')"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div>
        <label>Foto de entrega (obligatoria)</label>
        <div class="foto-drop" id="fotoDrop">
          <span class="material-symbols-outlined" style="font-size:36px;color:var(--muted-2);">photo_camera</span>
          <div class="text-small mt-2">Tocá para tomar foto</div>
          <input type="file" id="fotoInput" accept="image/*" capture="environment" style="display:none;"/>
        </div>
        <label>Cobro efectivo (contra-entrega, opcional)</label>
        <input type="number" id="cobroInput" min="0" step="0.01" placeholder="S/. 0.00"/>
        <div class="entrega-actions">
          <button class="btn success" id="btnConfirmarEntrega">Confirmar entrega</button>
          <button class="btn ghost" onclick="window.ui.closeModal('entregaModal')">Cancelar</button>
        </div>
        <div id="entregaMsg" class="text-small text-muted mt-2"></div>
      </div>
    </div>
  </div>
</template>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/js/config.js"></script>
<script src="/js/sb.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/router.js"></script>
<script>
window.shell.render({
  active:'reparto', title:'Entregas',
  onReady: async who => {
    let pedidoActual = null, fotoFile = null;
    window.ui.bindModalClose('entregaModal');
    async function load() {
      const list = document.getElementById('listaEntregas');
      list.innerHTML = '<div class="text-muted text-small">Cargando…</div>';
      try {
        // Repartidor: solo sus asignados. Otros: todos.
        let filter = 'select=*&order=fecha_entrega_acordada.asc.nullslast,fecha_pedido.asc';
        if (who.rol === 'repartidor') filter += `&repartidor_email=eq.${encodeURIComponent(who.email)}`;
        const rows = await window.sb.get('v_repartos_dia?' + filter);
        document.getElementById('leadEntregas').textContent = rows.length + ' entrega' + (rows.length===1?'':'s') + ' en Cajamarca';
        if (!rows.length) { list.innerHTML = '<div class="card text-muted text-small" style="text-align:center;padding:30px;">Sin entregas asignadas.</div>'; return; }
        list.innerHTML = rows.map(r => `
          <div class="entrega-card">
            <div class="zona">${window.ui.esc(r.zona_local || '—')}</div>
            <h4>${window.ui.esc(r.cliente_nombre || 'Sin nombre')} · ${window.ui.esc(r.pedido_codigo)}</h4>
            <div class="row"><span class="material-symbols-outlined">place</span><span>${window.ui.esc(r.direccion || 'A coordinar por WhatsApp')}</span></div>
            <div class="row"><span class="material-symbols-outlined">phone</span><span>${window.ui.esc(r.cliente_telefono || '—')}</span></div>
            <div class="row"><span class="material-symbols-outlined">payments</span><strong>${window.ui.fmtSoles(r.total)}</strong> · ${window.ui.esc(r.metodo_pago)}</div>
            ${r.notas_internas ? `<div class="row" style="background:#fef3c7;padding:6px 10px;border-radius:8px;margin-top:6px;"><span class="material-symbols-outlined">sticky_note_2</span>${window.ui.esc(r.notas_internas)}</div>` : ''}
            <div class="entrega-actions">
              <a class="btn secondary" href="https://maps.google.com/?q=${encodeURIComponent((r.direccion||'') + ' Cajamarca')}" target="_blank"><span class="material-symbols-outlined">map</span>Mapa</a>
              <a class="btn secondary" href="${window.ui.whatsappUrl(r.cliente_telefono, 'Hola ' + (r.cliente_nombre||'') + ', ya estoy llegando con tu pedido ' + r.pedido_codigo + ' 🌸')}" target="_blank"><span class="material-symbols-outlined">chat</span>WhatsApp</a>
              <button class="btn success" data-id="${r.id}" data-cod="${window.ui.esc(r.pedido_codigo)}" data-total="${r.total}" data-metodo="${window.ui.esc(r.metodo_pago)}"><span class="material-symbols-outlined">check_circle</span>Entregar</button>
            </div>
          </div>`).join('');
        list.querySelectorAll('button.btn.success').forEach(b => b.addEventListener('click', () => {
          pedidoActual = { id: b.dataset.id, codigo: b.dataset.cod, total: parseFloat(b.dataset.total), metodo: b.dataset.metodo };
          fotoFile = null;
          document.getElementById('fotoDrop').innerHTML = '<span class="material-symbols-outlined" style="font-size:36px;color:var(--muted-2);">photo_camera</span><div class="text-small mt-2">Tocá para tomar foto</div><input type="file" id="fotoInput" accept="image/*" capture="environment" style="display:none;"/>';
          document.getElementById('cobroInput').value = pedidoActual.metodo === 'contra_entrega' ? pedidoActual.total.toFixed(2) : '';
          document.getElementById('emCod').textContent = pedidoActual.codigo;
          document.getElementById('entregaMsg').textContent = '';
          window.ui.openModal('entregaModal');
          bindFotoDrop();
        }));
      } catch (e) {
        list.innerHTML = '<div class="card" style="text-align:center;padding:30px;color:var(--danger);">Error: ' + window.ui.esc(e.message) + '</div>';
      }
    }
    function bindFotoDrop() {
      const drop = document.getElementById('fotoDrop');
      const input = document.getElementById('fotoInput');
      drop.addEventListener('click', () => input.click());
      input.addEventListener('change', e => {
        fotoFile = e.target.files[0];
        if (!fotoFile) return;
        const url = URL.createObjectURL(fotoFile);
        drop.innerHTML = '<img src="' + url + '"/><div class="text-small mt-2 text-muted">Foto lista. Tocá para cambiar.</div><input type="file" id="fotoInput" accept="image/*" capture="environment" style="display:none;"/>';
        bindFotoDrop();
      });
    }
    document.getElementById('btnConfirmarEntrega').addEventListener('click', async () => {
      if (!pedidoActual) return;
      if (!fotoFile && who.rol === 'repartidor') { document.getElementById('entregaMsg').textContent = 'La foto es obligatoria.'; return; }
      document.getElementById('entregaMsg').textContent = 'Subiendo…';
      let path = null;
      if (fotoFile) {
        path = 'entregas/' + pedidoActual.id + '/' + Date.now() + '-' + fotoFile.name.replace(/[^a-zA-Z0-9.-]/g,'_');
        try { await window.sb.upload(window.VELIROZ_CRM.bucket, path, fotoFile); }
        catch (e) {
          // Outbox offline: guardar payload y reintentar
          const outbox = JSON.parse(localStorage.getItem('vel_reparto_outbox') || '[]');
          outbox.push({ pedido_id: pedidoActual.id, path, ts: Date.now() });
          localStorage.setItem('vel_reparto_outbox', JSON.stringify(outbox));
          document.getElementById('entregaMsg').textContent = 'Sin señal. Guardado local, retry cuando vuelva la red.';
          return;
        }
      }
      const cobro = parseFloat(document.getElementById('cobroInput').value || '0') || null;
      try {
        await window.sb.rpc('marcar_entregado', { p_pedido_id: pedidoActual.id, p_foto_path: path, p_cobro_efectivo: cobro });
        window.ui.toast('Entregado ✓', 'success');
        window.ui.closeModal('entregaModal');
        load();
      } catch (e) {
        document.getElementById('entregaMsg').textContent = 'Error: ' + e.message;
      }
    });
    load();
    // Auto-refresh cada 60s si es repartidor
    if (who.rol === 'repartidor') setInterval(load, 60000);
  }
});
</script>
</body>
</html>
