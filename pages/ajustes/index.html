<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Configuración · Veliroz CRM</title><meta name="robots" content="noindex, nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
<link rel="stylesheet" href="/css/main.css"/></head><body>
<div class="app"></div>
<template id="pageTemplate">
  <div class="page">
    <h2>Configuración</h2><p class="lead">Ajustes del negocio y de tu cuenta</p>
    <div class="tab-strip">
      <button class="tab-btn active" data-tab="config">Negocio</button>
      <button class="tab-btn" data-tab="perfil">Mi perfil</button>
    </div>
    <div id="tabConfig">
      <div class="card"><h3 style="margin-top:0;">Configuración KV</h3><p class="text-small text-muted">Cambiá con cuidado. Los valores se aplican al frontend en el próximo login.</p><div id="cfgList"><div class="text-muted text-small">Cargando…</div></div></div>
    </div>
    <div id="tabPerfil" class="hidden">
      <div class="card">
        <h3 style="margin-top:0;">Mi perfil</h3>
        <div class="form-grid">
          <label class="full">Nombre <input type="text" id="perfilNombre"/></label>
          <label>Email <input type="email" id="perfilEmail" disabled/></label>
          <label>Rol <input type="text" id="perfilRol" disabled/></label>
          <label class="full">Teléfono <input type="tel" id="perfilTel"/></label>
        </div>
        <div class="mt-4"><button class="btn" id="btnGuardarPerfil">Guardar</button></div>
        <hr class="mt-5 mb-4" style="border:none;border-top:1px solid var(--border-2);"/>
        <h3>Cambiar contraseña</h3>
        <div class="form-grid">
          <label class="full">Nueva contraseña <input type="password" id="passNueva" placeholder="mínimo 6 caracteres"/></label>
        </div>
        <div class="mt-4"><button class="btn secondary" id="btnCambiarPass">Cambiar contraseña</button></div>
      </div>
    </div>
  </div>
</template>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/js/config.js"></script><script src="/js/sb.js"></script><script src="/js/ui.js"></script>
<script src="/js/auth.js"></script><script src="/js/router.js"></script>
<script>
window.shell.render({
  active:'ajustes', title:'Configuración',
  onReady: async who => {
    const canEditConfig = ['creador','admin'].includes(who.rol);
    async function loadCfg() {
      const list = document.getElementById('cfgList');
      try {
        const rows = await window.sb.get('configuracion?select=*&order=clave');
        list.innerHTML = rows.map(r => `
          <div style="padding:10px 0;border-bottom:1px solid var(--border-2);">
            <label style="font-weight:600;">${window.ui.esc(r.clave)}</label>
            <div class="text-small text-muted mb-2">${window.ui.esc(r.descripcion || '')}</div>
            <textarea rows="2" style="width:100%;font-family:ui-monospace,'SF Mono',monospace;font-size:12px;" ${canEditConfig?'':'disabled'} data-clave="${window.ui.esc(r.clave)}">${window.ui.esc(JSON.stringify(r.valor))}</textarea>
            ${canEditConfig ? '<button class="btn sm mt-2" onclick="guardarCfg(\''+r.clave+'\')">Guardar</button>' : ''}
          </div>`).join('');
      } catch (e) { list.innerHTML = '<div style="color:var(--danger);">Error: ' + window.ui.esc(e.message) + '</div>'; }
    }
    window.guardarCfg = async (clave) => {
      const el = document.querySelector('textarea[data-clave="' + clave + '"]');
      let val;
      try { val = JSON.parse(el.value); }
      catch (e) { window.ui.toast('JSON inválido en ' + clave, 'danger'); return; }
      try { await window.sb.patch('configuracion?clave=eq.' + encodeURIComponent(clave), { valor: val, updated_at: new Date().toISOString(), updated_by: who.email }); window.ui.toast('Guardado', 'success'); }
      catch (e) { window.ui.toast('Error: ' + e.message, 'danger'); }
    };
    // Perfil
    document.getElementById('perfilNombre').value = who.nombre || '';
    document.getElementById('perfilEmail').value = who.email;
    document.getElementById('perfilRol').value = who.rol;
    document.getElementById('btnGuardarPerfil').addEventListener('click', async () => {
      try { await window.sb.patch('staff?email=eq.' + encodeURIComponent(who.email), { nombre: document.getElementById('perfilNombre').value.trim(), telefono: document.getElementById('perfilTel').value.trim() }); window.ui.toast('Perfil actualizado', 'success'); }
      catch (e) { window.ui.toast('Error: ' + e.message, 'danger'); }
    });
    document.getElementById('btnCambiarPass').addEventListener('click', async () => {
      const p = document.getElementById('passNueva').value;
      if (!p || p.length < 6) { window.ui.toast('Mínimo 6 caracteres', 'danger'); return; }
      try { await firebase.auth().currentUser.updatePassword(p); window.ui.toast('Contraseña cambiada', 'success'); document.getElementById('passNueva').value = ''; }
      catch (e) { window.ui.toast('Error: ' + (e.code || '') + ' - podés necesitar re-loginear', 'danger'); }
    });
    document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('tabConfig').classList.toggle('hidden', b.dataset.tab !== 'config');
      document.getElementById('tabPerfil').classList.toggle('hidden', b.dataset.tab !== 'perfil');
    }));
    if (new URLSearchParams(location.search).get('tab') === 'perfil') document.querySelector('.tab-btn[data-tab="perfil"]').click();
    loadCfg();
  }
});
</script></body></html>
